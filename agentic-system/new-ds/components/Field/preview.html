<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"></head>
<body class="sy-stage">
<div style="display:grid;gap:16px;max-width:340px">
<label class="sy-field"><span class="sy-field__label">Full name</span><input class="sy-field__input" placeholder="As shown on your ID"></label>
<label class="sy-field sy-field--error"><span class="sy-field__label">Social Security number</span><input class="sy-field__input" placeholder="XXX-XX-XXXX"><span class="sy-field__hint">Required</span></label>
<label class="sy-field sy-field--active sy-field--done"><span class="sy-field__label">Email</span><input class="sy-field__input" value="maria@univ.edu"><span class="sy-field__done"><span class="sy-check "><svg viewBox="0 0 10 10"><path d="M2 5.2 4.2 7.4 8 3"/></svg></span></span></label>
<label class="sy-field sy-field--waiting"><span class="sy-field__label">Passport details</span><input class="sy-field__input" placeholder="Waiting for you" disabled></label></div>

</body></html>
