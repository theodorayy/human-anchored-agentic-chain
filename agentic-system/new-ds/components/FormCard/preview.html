<!-- @dsCard group="Containers" height=430 subtitle="Create-your-account card, plain and in a window" -->
<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"></head>
<body class="sy-stage">
<div class="sy-row" style="align-items:flex-start;gap:32px">
<div class="sy-window" style="width:300px"><div class="sy-window__bar"><i></i><i></i><i></i></div>
<div class="sy-card"><h3 class="sy-card__title">Create your account</h3>
<label class="sy-field"><span class="sy-field__label">Full name</span><input class="sy-field__input" placeholder="As shown on your ID"></label>
<label class="sy-field"><span class="sy-field__label">Email</span><input class="sy-field__input" placeholder="name@email.com"></label>
<label class="sy-field"><span class="sy-field__label">Social Security number</span><input class="sy-field__input" placeholder="XXX-XX-XXXX"></label>
<button class="sy-btn sy-btn--primary sy-btn--block">Create account</button></div></div>
<div class="sy-card sy-tilt-l" style="width:260px"><h3 class="sy-card__title">Create your account</h3>
<label class="sy-field"><span class="sy-field__label">Full name</span><input class="sy-field__input" placeholder="As shown on your ID"></label>
<button class="sy-btn sy-btn--primary sy-btn--block">Create account</button><p class="sy-card__foot">Already have an account? Log in</p></div></div>

</body></html>
